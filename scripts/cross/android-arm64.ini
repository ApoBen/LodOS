# meson cross file: Android NDK r30, aarch64-linux-android29.
# NDK bin dir must be on PATH (source orch/env.sh).
[binaries]
c = 'aarch64-linux-android29-clang'
cpp = 'aarch64-linux-android29-clang++'
ar = 'llvm-ar'
strip = 'llvm-strip'
nm = 'llvm-nm'
objcopy = 'llvm-objcopy'
pkg-config = '/bin/false'

[built-in options]
c_args = ['-fPIC']
cpp_args = ['-fPIC']
c_link_args = ['-static-libstdc++']
cpp_link_args = ['-static-libstdc++']

[host_machine]
system = 'android'
cpu_family = 'aarch64'
cpu = 'armv8'
endian = 'little'
