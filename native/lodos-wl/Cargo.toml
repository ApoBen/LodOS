[package]
name = "lodos-wl"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
name = "lodos_wl"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "lodos-wl"
path = "src/main.rs"

[features]
default = []
headless = []

[dependencies]
jni-sys = "0.4"
libc = "0.2"
smithay = { version = "0.7", default-features = false, features = ["wayland_frontend"] }

[dev-dependencies]
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }

[profile.release]
strip = true
lto = true
opt-level = "s"
